[pytest]
# Only the real test suite is collected.
#
# The repository root also holds a number of older `test_*.py` files that are
# print-only exploration scripts, not tests: they make live network calls at
# import time and assert nothing.  They are kept for reference but must never be
# collected, because collecting them would fire real requests at OpenAlex and
# Semantic Scholar during a test run.
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Keep the root scripts and generated directories out of collection entirely.
norecursedirs = api sources templates __pycache__ .git .venv venv

addopts =
    -q
    --strict-markers
    --strict-config
    -p no:cacheprovider

filterwarnings =
    default
